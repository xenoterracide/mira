name: precommit
on: [push, workflow_call]
jobs:
  license:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5.0.1
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          filter: "blob:none"
          fetch-depth: 0
      - uses: actions/setup-python@v6.0.0
        with:
          python-version: "3"
      - run: pip install -r requirements.txt
      - run: reuse lint
# see node.yml for format
